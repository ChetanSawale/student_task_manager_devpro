apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:

  name: student-task-manager

  namespace: argocd

spec:

  project: default

  source:

    repoURL: https://github.com/ChetanSawale/student_task_manager_devpro.git

    targetRevision: master

    path: Devops_project_rs/k8s

  destination:

    server: https://kubernetes.default.svc

    namespace: student-app

  syncPolicy:

    automated:

      prune: true

      selfHeal: true

    syncOptions:

      - CreateNamespace=true

